<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <title>Pendaftaran Member (JavaScript Latihan 5)</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
    <h1>Form Pendaftaran Member</h1>
    <form action="#" method="post" onsubmit="return fn_ValForm();">
        <p>
            Nama:<br />
            <input type="text" id="nama" name="nama" autocomplete="off" />
        </p>
        <p>
            Email:<br />
            <input type="text" id="email" name="email" autocomplete="off" />
        </p>
        <p>
            Umur:<br />
            <input type="text" id="umur" name="umur" autocomplete="off" />
        </p>
        <p>
            Kode Paket (S / G / P):<br />
            <input type="text" id="paket" name="paket" maxlength="1" autocomplete="off" />
        </p>
        <p>
            <input type="submit" value="Daftar" />
            <input type="reset" value="Reset" />
        </p>
    </form>
    <script type="text/javascript" src="js/script.js"></script>
</body>
</html>
