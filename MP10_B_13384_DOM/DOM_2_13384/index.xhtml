<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Konversi Suhu - Dengan DOM</title>
  <script type="text/javascript" src="js/domSuhu.js"></script>
</head>
<body>
  <h1>Konversi Suhu Celcius ke Fahrenheit</h1>
  <form action="">
    <label for="celcius">Masukkan Suhu (Celcius): </label>
    <input type="text" id="celcius" />
    <input type="button" value="Hitung Suhu" onclick="konversiSuhu();" />
  </form>
  <p>Hasil: <span id="hasil">0</span> &deg;F</p>
  <p id="keterangan"></p>
</body>
</html>
